name: Chatbot Integration Validation

on:
  push:
    branches:
      - feature/chatbot-webview-bridge-20261031
    paths:
      - 'app/src/main/**'
      - '.github/workflows/chatbot-validation.yml'

permissions:
  contents: read

jobs:
  compile-release-kotlin:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile Android Release Kotlin
        run: ./gradlew :app:compileReleaseKotlin --no-daemon --stacktrace
